<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home View Demo</title>
<style>
  body { margin: 0; padding: 16px; background: #0b0c0e; color: #e6edf2; font-family: system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; }
  dialog { background: #1d2127; color: #e6edf2; border: 1px solid #333; border-radius: 12px; min-width: 280px; max-width: 90vw; }
  dialog img { width: 100%; border-radius: 8px; }
  dialog pre { font-size: 12px; white-space: pre-wrap; }
  dialog button { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <home-view-card id="card"></home-view-card>
</main>
<dialog id="info"><h3></h3><div class="body"></div><form method="dialog"><button>Close</button></form></dialog>

<script type="module">
import yaml from "https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.mjs";
import "../home-view-card.js";

const config = yaml.load(await (await fetch("../examples/house.yaml")).text());
const ago = (min) => new Date(Date.now() - min * 60000).toISOString();
const st = (state, attributes = {}, min = 12) => ({ state, attributes, last_changed: ago(min) });

const states = {
  "binary_sensor.door_front_contact": st("off", { device_class: "door", friendly_name: "Front Door" }, 40),
  "binary_sensor.door_office_contact": st("off", { device_class: "door", friendly_name: "Office Door" }, 90),
  "sensor.temp_serverrack_temperature": st("78.1", { device_class: "temperature", unit_of_measurement: "°F", friendly_name: "Server Rack Temp" }),
  "sensor.temp_office_temperature": st("72.6", { device_class: "temperature", unit_of_measurement: "°F" }),
  "sensor.temp_office_humidity": st("38", { device_class: "humidity", unit_of_measurement: "%" }),
  "binary_sensor.door_bedroomsliding_contact": st("off", { device_class: "door", friendly_name: "Bedroom Sliding" }, 300),
  "binary_sensor.door_basement_contact": st("on", { device_class: "door", friendly_name: "Basement Door" }, 4),
  "binary_sensor.hallway1_motion": st("on", { device_class: "motion", friendly_name: "Hallway Motion" }, 1),
  "binary_sensor.living_room_motion": st("off", { device_class: "motion", friendly_name: "Living Room Motion" }),
  "climate.thermostat": st("heat", { friendly_name: "Thermostat", current_temperature: 69, temperature: 71, hvac_action: "heating" }),
  "camera.hallway_high_resolution_channel": st("streaming", { friendly_name: "Hallway", entity_picture: "cam.svg?cam=hallway" }),
  "camera.westons_room_high_resolution_channel": st("streaming", { friendly_name: "Weston's Room", entity_picture: "cam.svg?cam=westons_room" }),
  "camera.backyard_high_resolution_channel": st("streaming", { friendly_name: "Back Yard", entity_picture: "cam.svg?cam=back_yard" }),
  "camera.living_room_high_resolution_channel": st("streaming", { friendly_name: "Living Room", entity_picture: "cam.svg?cam=living_room" }),
  "camera.driveway_high_resolution_channel_2": st("streaming", { friendly_name: "Front Yard", entity_picture: "cam.svg?cam=front_yard" }),
  "camera.rack_01_front_mainstream": st("streaming", { friendly_name: "Server Rack", entity_picture: "cam.svg?cam=server_rack" }),
  "binary_sensor.backyard_motion": st("off", { device_class: "motion" }),
  "binary_sensor.backyard_person_detected": st("off", { device_class: "occupancy" }),
  "binary_sensor.backyard_vehicle_detected": st("off", { device_class: "occupancy" }),
  "binary_sensor.backyard_animal_detected": st("off", { device_class: "occupancy" }),
  "binary_sensor.driveway_motion_2": st("on", { device_class: "motion" }),
  "binary_sensor.driveway_person_detected": st("on", { device_class: "occupancy" }),
  "binary_sensor.driveway_vehicle_detected": st("on", { device_class: "occupancy" }),
  "binary_sensor.driveway_animal_detected": st("off", { device_class: "occupancy" }),
  "binary_sensor.westons_room_baby_cry_detected": st("on", { device_class: "sound" }),
  "binary_sensor.westons_room_person_detected": st("off", { device_class: "occupancy" }),
  "binary_sensor.westons_room_animal_detected": st("off", { device_class: "occupancy" }),
  "binary_sensor.rack_01_rear_motion": st("off", { device_class: "motion" }),
  "sensor.temp_serverrack_humidity": st("29", { device_class: "humidity", unit_of_measurement: "%" }),
  "media_player.spotify": { state: "playing", last_changed: ago(3), attributes: { friendly_name: "Spotify", source: "Living Room Speaker", media_title: "Midnight City", media_artist: "M83", media_album_name: "Hurry Up, We're Dreaming", entity_picture: "album.svg", media_duration: 243, media_position: 61, media_position_updated_at: new Date().toISOString(), volume_level: 0.42 } },
  "sensor.dexcom_glucose_value": { state: "142", last_changed: ago(2), last_updated: ago(2), attributes: { unit_of_measurement: "mg/dL", friendly_name: "Glucose" } },
  "sensor.dexcom_glucose_trend": st("rising_slightly"),
  "weather.forecast_home": st("partlycloudy", { friendly_name: "Home", temperature: 64, humidity: 52, wind_speed: 9, wind_speed_unit: "mph", temperature_unit: "°F" }),
  "sun.sun": st("above_horizon"),
  "media_player.bedroom_tv_2": st("playing", { friendly_name: "Bedroom TV", source: "Netflix", app_name: "Netflix", media_title: "The Great British Baking Show", media_series_title: "Season 5", supported_features: 152463, volume_level: 0.2 }),
  "sensor.temp_livingrm_temperature": st("70.2", { device_class: "temperature", unit_of_measurement: "°F" }),
  "sensor.temp_livingrm_humidity": st("41", { device_class: "humidity", unit_of_measurement: "%" }),
};

const card = document.getElementById("card");
const forecast = ["partlycloudy", "rainy", "pouring", "cloudy", "sunny", "sunny", "lightning-rainy"].map((condition, i) => {
  const d = new Date(); d.setDate(d.getDate() + i); d.setHours(12, 0, 0, 0);
  return { datetime: d.toISOString(), condition, temperature: 66 - i * 2 + (i % 3) * 4, templow: 48 - i + (i % 2) * 3, precipitation_probability: [10, 70, 90, 30, 0, 0, 60][i] };
});
const connection = { subscribeMessage: async (cb) => { setTimeout(() => cb({ type: "daily", forecast }), 50); return () => {}; } };
const push = () => { card.hass = { states: { ...states }, callService, callApi, connection, hassUrl: (p) => p }; };

async function callApi(method, path) {
  const ids = decodeURIComponent(path.split("filter_entity_id=")[1].split("&")[0]).split(",");
  const at = (min) => new Date(Date.now() - min * 60000).toISOString();
  const script = {
    "sensor.dexcom_glucose_value": [[180, "118"], [175, "125"], [170, "132"], [165, "139"], [160, "145"], [155, "150"], [150, "155"], [145, "159"], [140, "161"], [135, "163"], [130, "164"], [125, "163"], [120, "162"], [115, "160"], [110, "157"], [105, "153"], [100, "148"], [95, "143"], [90, "138"], [85, "132"], [80, "127"], [75, "121"], [70, "117"], [65, "112"], [60, "108"], [55, "106"], [50, "103"], [45, "102"], [40, "102"], [35, "103"], [30, "106"], [25, "109"], [20, "113"], [15, "118"], [10, "123"], [5, "129"]],
    "binary_sensor.door_front_contact": [[300, "on"], [298, "off"], [95, "on"], [94, "off"]],
    "binary_sensor.door_office_contact": [[200, "on"], [190, "off"]],
    "binary_sensor.door_basement_contact": [[4, "on"]],
    "binary_sensor.driveway_person_detected": [[96, "on"], [95, "off"], [3, "on"]],
    "binary_sensor.driveway_vehicle_detected": [[2, "on"]],
    "binary_sensor.westons_room_baby_cry_detected": [[1500, "on"], [1497, "off"], [12, "on"]],
    "binary_sensor.hallway1_motion": [[60, "on"], [59, "off"], [1, "on"]],
    "binary_sensor.backyard_animal_detected": [[1700, "on"], [1699, "off"]],
  };
  return ids.filter((id) => script[id]).map((id) => [
    { entity_id: id, state: "off", last_changed: at(1800) },
    ...script[id].map(([m, s]) => ({ state: s, last_changed: at(m) })),
  ]);
}

function callService(domain, service, data) {
  const id = data.entity_id;
  const cur = states[id];
  if (domain === "media_player" && cur) {
    const a = { ...cur.attributes };
    let state = cur.state;
    if (service === "toggle") state = state === "off" ? "on" : "off";
    if (service === "media_play_pause") {
      if (state === "playing") a.media_position += (Date.now() - Date.parse(a.media_position_updated_at)) / 1000;
      state = state === "playing" ? "paused" : "playing";
      a.media_position_updated_at = new Date().toISOString();
    }
    if (service === "media_next_track" || service === "media_previous_track") { a.media_position = 0; a.media_position_updated_at = new Date().toISOString(); }
    if (service === "volume_set") a.volume_level = data.volume_level;
    states[id] = { ...cur, state, attributes: a };
    push();
    return;
  }
  if (service === "toggle" && cur) {
    states[id] = { ...cur, state: cur.state === "on" ? "off" : "on", last_changed: new Date().toISOString() };
    push();
  }
}

card.setConfig(config);
push();

window.addEventListener("hass-more-info", (e) => {
  const id = e.detail.entityId;
  const s = states[id];
  const dlg = document.getElementById("info");
  dlg.querySelector("h3").textContent = s?.attributes.friendly_name || id;
  const body = dlg.querySelector(".body");
  body.innerHTML = "";
  if (id.startsWith("camera.")) {
    const img = document.createElement("img");
    img.src = s.attributes.entity_picture;
    body.append(img);
  }
  const pre = document.createElement("pre");
  pre.textContent = JSON.stringify(s, null, 2);
  body.append(pre);
  dlg.showModal();
});

const flip = ["binary_sensor.door_front_contact", "binary_sensor.living_room_motion", "binary_sensor.backyard_animal_detected"];
setInterval(() => {
  const id = flip[Math.floor(Math.random() * flip.length)];
  states[id] = { ...states[id], state: states[id].state === "on" ? "off" : "on", last_changed: new Date().toISOString() };
  push();
}, 6000);
</script>
</body>
</html>
