type: custom:home-view-card
title: Home
view_box: [55, -115, 1460, 1060]
stack:
  split_x: 780
  move: [-760, 920]
  below: 700

labels:
  - text: Main Floor
    x: 575
    y: 18
  - text: Basement
    x: 1163
    y: 18

glucose:
  entity: sensor.dexcom_glucose_value
  trend: sensor.dexcom_glucose_trend
  low: 70
  high: 180

weather: weather.forecast_home

media:
  - media_player.spotify
  - entity: media_player.bedroom_tv_2
    name: Bedroom TV
    sources:
      - entity: media_player.bedroom_tv_3
        app: Jellyfin

climate:
  entity: climate.living_room
  name: Thermostat
  humidity: sensor.living_room_humidity

server:
  - name: SRV01
    cpu: sensor.srv01_cpu_usage
    memory: sensor.srv01_memory_usage
  - name: Jellyfin
    cpu: sensor.jellyfin_cpu_usage
    memory: sensor.jellyfin_memory_usage
    disk: sensor.jellyfin_disk_usage
  - name: Sonarr
    cpu: sensor.tv_herrell_us_cpu_usage
    memory: sensor.tv_herrell_us_memory_usage
    disk: sensor.tv_herrell_us_disk_usage
  - name: Radarr
    cpu: sensor.movies_herrell_us_cpu_usage
    memory: sensor.movies_herrell_us_memory_usage
    disk: sensor.movies_herrell_us_disk_usage
  - name: Immich
    cpu: sensor.photos_herrell_us_cpu_usage
    memory: sensor.photos_herrell_us_memory_usage
    disk: sensor.photos_herrell_us_disk_usage

stats:
  - name: Overseerr
    tiles:
      - entity: sensor.seerr_pending_requests
        name: Pending
        warn_above: 0
      - entity: sensor.seerr_processing_requests
        name: Active
      - entity: sensor.seerr_open_issues
        name: Issues
        bad_above: 0

network:
  latency:
    - entity: sensor.udm_pro_cloudflare_wan_latency
      name: Cloudflare
    - entity: sensor.udm_pro_google_wan_latency
      name: Google
    - entity: sensor.udm_pro_microsoft_wan_latency
